/* Export FCST view as-is — MX7 / MX Pro sheets, segment groups + customer monthly + Total/BP/DM */
function exportFcstExcel(){
  if(typeof XLSX==='undefined'||!XLSX.utils){ toast('Could not load the Excel module (check your network)','err'); return; }
  const wb=XLSX.utils.book_new();
  ['MX7','MX Pro'].forEach(model=>{
    const bp = model==='MX7'?BP_MX7:BP_MX22;
    const dm = model==='MX7'?CFG.dmMX7:CFG.dmMX22;
    const rows=fcstRows(model);
    const aoa=[];
    aoa.push(['Account','Segment','Stage',...MONTHS,'Total']);
    // group by segment
    const bySeg={};
    rows.forEach(c=>{ (bySeg[c.segment]=bySeg[c.segment]||[]).push(c); });
    SEG_NAMES.forEach(seg=>{
      const list=bySeg[seg]; if(!list||!list.length)return;
      aoa.push([`${seg} (${list.length})`,'','',...Array(12).fill(''),'']); // group header row
      list.forEach(c=>{
        const arr=monthsOf(c,model);
        aoa.push([c.name,c.segment,STAGE_MAP[c.stage].name,...arr.map(v=>num(v)),rowTotal(c,model)]);
      });
    });
    // Total / BP / DM
    const totals=fcstMonthlyTotals(model);
    aoa.push([`Total (${rows.length})`,'','',...totals.map(v=>num(v)),sum(totals)]);
    aoa.push(['2026 BP','','',...bp.map(v=>num(v)),sum(bp)]);
    aoa.push(['2026 DM','','',...dm.map(v=>num(v)),sum(dm)]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:28},{wch:16},{wch:13},...MONTHS.map(()=>({wch:6})),{wch:8}];
    XLSX.utils.book_append_sheet(wb,ws,model);
  });
  XLSX.writeFile(wb,`Humax_B2B_FCST_${today()}.xlsx`);
  toast('FCST downloaded','ok');
}
function importFile(ev){
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  if(f.name.endsWith('.json')){
    rd.onload=e=>{ try{
      const arr=JSON.parse(e.target.result);
      if(!Array.isArray(arr))throw new Error('not an array');
      STATE.customers=arr.map(makeCustomer); persist(); render();
      toast(`Imported ${arr.length} records`,'ok');
    }catch(err){ toast('JSON format error: '+err.message,'err'); } };
    rd.readAsText(f);
  }else{
    if(typeof XLSX==='undefined'||!XLSX.read){ toast('Could not load the Excel module (check your network)','err'); ev.target.value=''; return; }
    rd.onload=e=>{ try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=XLSX.utils.sheet_to_json(ws,{header:1});
      const imported=parseAoa(aoa);
      STATE.customers=imported; persist(); render();
      toast(`Imported ${imported.length} records`,'ok');
    }catch(err){ toast('Excel parse error: '+err.message,'err'); } };
    rd.readAsArrayBuffer(f);
  }
  ev.target.value='';
}
function parseAoa(aoa){
  // find the header row
  let hi=aoa.findIndex(r=>r&&r.some(c=>/name/i.test(String(c))&&!/partner|contact/i.test(String(c))));
  if(hi<0)hi=0;
  const head=aoa[hi].map(h=>String(h||'').trim().toLowerCase());
  const col=n=>head.findIndex(h=>h===n.toLowerCase());
  const idx={name:col('name'),seg:col('segment'),sub:col('sub'),stage:col('stage'),
    tp:col('target product'),tv:col('target volume'),sd:col('start date'),
    pn:col('partner name'),owner:col('owner'),cn:col('contact name')};
  const out=[];
  for(let i=hi+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r||!r[idx.name>=0?idx.name:0])continue;
    const get=(k)=>idx[k]>=0?r[idx[k]]:'';
    // monthly: headers like 'mx7 jan'
    const mx7=MONTHS.map(m=>{const ci=head.findIndex(h=>h==='mx7 '+m.toLowerCase());return ci>=0?num(r[ci]):0;});
    const mx22=MONTHS.map(m=>{const ci=head.findIndex(h=>h==='mx22 '+m.toLowerCase());return ci>=0?num(r[ci]):0;});
    out.push(makeCustomer({
      name:get('name'),segment:get('seg'),sub:get('sub'),stage:get('stage'),
      target_product:get('tp'),target_volume:get('tv'),start_date:get('sd'),
      partner_name:get('pn'),owner:get('owner'),contact_name:get('cn'),
      mx7_months:mx7,mx22_months:mx22,
    }));
  }
  return out;
}
function resetAll(){
  if(!confirm('Clear all local data and reset to the initial seed data?'))return;
  STATE.customers=SEED.map(makeCustomer); persist(); render();
  toast('Reset complete');
}
function dl(blob,name){ const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function today(){ const d=new Date();return d.toISOString().slice(0,10); }

/* =========================================================================
   Boot
   ========================================================================= */
function boot(){
  loadLocal();
  const vEl=$('#appVer'); if(vEl){ vEl.textContent=APP_VERSION; vEl.title='Build '+APP_BUILD; }
  if(!STATE.customers.length){ STATE.customers=SEED.map(makeCustomer); saveLocal(); }
  refreshConn();
  // nav binding
  $$('.nav-item').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));
  $('#syncBtn').addEventListener('click',()=>{ if(CFG.gasUrl)sheetsPull(); else go('data'); });
  // close modal on outside click
  $('#custModal').addEventListener('click',e=>{ if(e.target.id==='custModal')closeCust(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeCust(); });
  render();
  // background pull if connected
  if(CFG.gasUrl) sheetsPull({silent:true});
}
boot();
